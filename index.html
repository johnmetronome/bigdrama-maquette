<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Drama</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Big Drama, théâtre immersif à Paris. Maquette de travail du nouveau site.">
<link rel="icon" href="logos/big-drama-clef.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Montserrat:wght@300;400;500&family=Special+Elite&display=swap">
<style>
/* Big Drama · maquette v5 · la rue, Paris 1918 · Claude (référence pour Codex)
   Repos : la rue, aucun texte. Survol : le logo se dessine à l'encre. Clic : le bâtiment se trace en blueprint,
   les autres lieux restent en fantômes sur les côtés, l'histoire se déroule sur son propre support. */
:root{
  --nuit:#0b0907; --jaune:#F2D10F; --lumiere:#FFE34D; --noir:#0A0A0A; --plan:#1F4E8C; --trait:#EAF2FF;
  --f-titre:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif; --f-texte:"Montserrat","Helvetica Neue",Arial,sans-serif; --f-machine:"Special Elite","Courier New",monospace;
  --lent:cubic-bezier(.33,0,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:#efe8dc;overflow:hidden}
body{font:300 15px/1.6 var(--f-texte);-webkit-font-smoothing:antialiased}
.monde{position:fixed;inset:0;display:grid;place-items:center}
.scene{position:relative;width:min(100vw,calc(100svh * 16 / 9));aspect-ratio:16/9;background:var(--jaune);overflow:hidden;touch-action:none;cursor:grab}
.scene.glisse{cursor:grabbing}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (max-aspect-ratio:1/1){.scene{width:100vw;height:min(66svh,150vw);aspect-ratio:auto}}

/* marque et son, discrets */
.marque{position:fixed;left:max(16px,env(safe-area-inset-left));top:14px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none;color:var(--noir);transition:color 900ms var(--lent)}
.marque img{width:26px;height:26px;transition:filter 900ms}
.en-coupe .marque{color:var(--trait)}.en-coupe .marque img{filter:invert(1)}
.marque b{font:italic 400 22px/1 var(--f-titre)}
.son{position:fixed;right:max(16px,env(safe-area-inset-right));top:12px;z-index:5;background:none;border:1px solid currentColor;color:var(--noir);transition:color 900ms var(--lent);font:500 10px/1 var(--f-texte);letter-spacing:.24em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
.son[aria-pressed="true"]::after{content:" ●"}
.en-coupe .son{color:var(--trait)}
@media (max-aspect-ratio:1/1){.marque,.son{color:#efe8dc}.marque img{filter:invert(1)}}
button:focus-visible,.lieu:focus-visible,.piece:focus-visible,.fantome:focus-visible{outline:2px solid #c9a35b;outline-offset:3px}

/* lieux au repos et au survol */
.lieu{cursor:pointer;transition:opacity 500ms ease-out,filter 500ms ease-out,transform 700ms var(--lent);transform-box:fill-box}
.lieu:focus{outline:none}
.scene.survol .lieu,.scene.survol .calque-decor{transition:opacity 900ms var(--lent),filter 900ms var(--lent),transform 900ms var(--lent)}
/* les autres lieux ne bougent pas : seul le lieu survolé s'élève et s'éclaire */
.lieu.actif{filter:drop-shadow(0 0 5px rgba(255,227,77,.3));transform:translateY(-2px)}
.zone{fill:transparent}

/* le logo se dessine à l'encre, sans carton */
/* le logo apparaît en bas, au centre, dans la bande noire de la rue. Réglages : REGLAGE_LOGOS, ou ?reglage dans l'adresse */
.logo-survol{position:absolute;left:50%;top:var(--logo-y,88%);pointer-events:none;transform:translate(-50%,-50%);opacity:0;filter:blur(4px);clip-path:inset(0 100% 0 0);transition:opacity 300ms ease-out,filter 300ms ease-out,clip-path 0s 300ms;color:var(--lumiere)}
.logo-survol.vu{opacity:1;filter:blur(0);clip-path:inset(0 0 0 0);transition:opacity 700ms var(--lent),filter 1000ms var(--lent),clip-path 1300ms var(--lent)}
.logo-survol .encre{display:block;background:currentColor;-webkit-mask:var(--masque) center/contain no-repeat;mask:var(--masque) center/contain no-repeat}
.logo-survol .titre{display:block;font:italic 400 var(--titre-px,28px)/1 var(--f-titre);white-space:nowrap}
.coupe .logo-survol{color:var(--trait)}
.reglage{position:fixed;left:16px;bottom:16px;z-index:9;background:#111;color:#eee;border:1px solid #444;padding:12px 14px;font:12px/1.5 var(--f-texte);display:grid;gap:6px;width:300px}
.reglage label{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center}
.reglage textarea{width:100%;height:84px;font:11px/1.4 ui-monospace,Menlo,monospace;background:#000;color:#9f9;border:1px solid #333}
.reglage button{font:500 11px/1 var(--f-texte);padding:8px;cursor:pointer}

/* le seuil : la clé de Big Drama, un clic ouvre la rue et libère le son */
.seuil{position:fixed;inset:0;z-index:30;background:#070605;display:grid;place-items:center;transition:opacity 1.8s var(--lent),visibility 0s 1.8s}
.seuil.ouvert{opacity:0;visibility:hidden}
.seuil button{all:unset;cursor:pointer;display:grid;place-items:center;width:120px;height:120px;border-radius:50%}
.seuil img{height:96px;width:auto;opacity:.9;animation:respire 3.2s ease-in-out infinite}
.seuil button:focus-visible{outline:1px solid #c9a35b;outline-offset:8px}
@keyframes respire{50%{transform:scale(1.08);opacity:.55}}
/* le film d'accueil sur le panneau des toits, et les films verticaux à travers les fenêtres */
.film-accueil{position:absolute;object-fit:cover;pointer-events:none;opacity:0;transition:opacity 2.4s var(--lent);filter:sepia(.25) contrast(1.05) brightness(.95)}
.film-accueil.pret{opacity:1}
.coupe .film-accueil{opacity:0}
.vitre{position:absolute;pointer-events:none;opacity:0;transition:opacity 1.2s var(--lent);-webkit-mask:var(--masque) 0 0/100% 100% no-repeat;mask:var(--masque) 0 0/100% 100% no-repeat}
.vitre.vu{opacity:1;transition:opacity 1.8s var(--lent)}
.vitre video{width:100%;height:100%;object-fit:cover;filter:sepia(.35) saturate(1.1) brightness(1.08)}
.coupe .vitre{opacity:0}
.panneau{cursor:pointer}
/* blueprint, épuré */
.photo-piece{opacity:0;filter:grayscale(1) sepia(1) hue-rotate(178deg) saturate(2.4) brightness(.72) contrast(1.1);animation:developpe 1.6s var(--lent) forwards;animation-delay:var(--t,0s);transition:filter 1.4s var(--lent),opacity 1.4s var(--lent)}
@keyframes developpe{to{opacity:.32}}
.piece:hover .photo-piece,.piece:focus .photo-piece,.piece.vue .photo-piece{animation:none;opacity:1;filter:none}
/* écran du support et salle de projection */
.ouvrir-ecran{all:unset;cursor:zoom-in;display:block}
.ecran{position:relative;margin:0;aspect-ratio:16/9;width:100%;-webkit-mask:var(--masque) center/100% 100% no-repeat;mask:var(--masque) center/100% 100% no-repeat;background:#000;overflow:hidden}
.ecran .defile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transform-origin:50% 40%;transition:opacity 1.8s var(--lent),transform 7s linear}
.ecran .defile img.actif{opacity:1;transform:scale(1.12)}
.ecran video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s var(--lent)}
.ecran video.pret{opacity:1}
.support .logo{width:72%;justify-self:center}
.support .encre,.salle .encre{display:block;width:100%;background:currentColor;-webkit-mask:var(--masque) center/contain no-repeat;mask:var(--masque) center/contain no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.salle{position:fixed;inset:0;z-index:20;background:rgba(5,4,3,.94);display:grid;place-items:center;align-content:center;gap:14px;opacity:0;transition:opacity 700ms var(--lent);cursor:zoom-out;padding:24px}
.salle.vu{opacity:1}
.salle .ecran{width:min(90vw,calc(80svh * 16 / 9));transform:scale(.94);transition:transform 1.2s var(--lent);-webkit-mask:none;mask:none;border-radius:6px;box-shadow:0 0 0 1px #2a241c,0 40px 120px rgba(0,0,0,.8)}
.salle.vu .ecran{transform:none}
.salle .legende{margin:0;font:400 12px/1.5 var(--f-texte);color:#a89c8b;max-width:70ch;text-align:center}
.salle .fermer{position:absolute;right:18px;top:12px;background:none;border:0;color:#efe8dc;font:300 30px/1 var(--f-texte);cursor:pointer}
/* blueprint */
.bleu{opacity:0;pointer-events:none;transition:opacity 900ms var(--lent)}
.coupe .bleu{opacity:1;pointer-events:auto}
.bleu .fond{fill:var(--plan)}
.bleu .grille{opacity:0;transition:opacity 1200ms 300ms var(--lent)}
.coupe .bleu .grille{opacity:1}
.trait path,.fantome path{fill:none;stroke:var(--trait);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.trace{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:trace var(--d,2.6s) var(--lent) forwards;animation-delay:var(--t,0s)}
@keyframes trace{to{stroke-dashoffset:0}}
.fantome{opacity:.1;cursor:pointer;transition:opacity 700ms var(--lent)}
.fantome .zone-f{fill:transparent;stroke:none}
.fantome:hover,.fantome:focus,.fantome.vu{opacity:.55}
.cote{fill:none;stroke:var(--trait);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.75}
.piece rect{fill:none;stroke:var(--trait);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.9}
.piece rect.trace{stroke-dasharray:var(--l)}
.piece path{fill:none;stroke:var(--trait);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.85}
.piece .num{font:11px var(--f-machine);fill:var(--trait);opacity:0;animation:apparait 800ms var(--lent) forwards;animation-delay:var(--t,0s)}
@keyframes apparait{to{opacity:.85}}
.piece{cursor:help}
.piece:hover rect,.piece:focus rect,.piece.vue rect{opacity:1;stroke-width:2}
.bulle{position:absolute;pointer-events:none;background:rgba(31,78,140,.96);color:var(--trait);font:13px/1.45 var(--f-texte);padding:11px 14px;border:1px solid var(--trait);width:max-content;max-width:min(280px,70vw);opacity:0;transform:translate(-50%,calc(-100% - 6px));transition:opacity 400ms var(--lent),transform 400ms var(--lent)}
.bulle.vue{opacity:1;transform:translate(-50%,calc(-100% - 14px))}
.bulle.dessous{transform:translate(-50%,6px)}.bulle.dessous.vue{transform:translate(-50%,14px)}
.bulle b{display:block;font:italic 400 19px/1.15 var(--f-titre);margin-bottom:4px}
.retour{position:absolute;left:12px;bottom:12px;z-index:3;font:500 10px/1 var(--f-texte);letter-spacing:.22em;text-transform:uppercase;background:var(--plan);color:var(--trait);border:1px solid var(--trait);padding:11px 14px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 600ms var(--lent)}
.coupe .retour{opacity:1;pointer-events:auto}

/* le support de l'histoire : il se déroule à côté du plan */
.support{position:absolute;z-index:4;right:3%;top:8%;width:min(34%,400px);max-height:84%;overflow:auto;padding:28px 26px 24px;display:grid;gap:12px;visibility:hidden;color:#1b1712;font:400 14px/1.6 var(--f-texte);scrollbar-width:thin}
.support.vu{visibility:visible}
.support h2{margin:0;font:italic 400 32px/1.05 var(--f-titre);text-align:center;text-wrap:balance}
.support .cap{font:500 10px/1.4 var(--f-texte);letter-spacing:.26em;text-transform:uppercase;text-align:center;opacity:.7}
.support .resume{font:italic 400 18px/1.45 var(--f-titre);margin:0;text-align:center}
.support dl{margin:4px 0 0;display:grid;gap:6px;border-top:1px solid currentColor;padding-top:10px}
.support dl div{display:grid;grid-template-columns:auto 1fr;gap:12px}
.support dt{font:500 9.5px/1.9 var(--f-texte);letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.support dd{margin:0;font-size:13px}
.support .lorem{margin:0;font-size:13px;opacity:.75}
.support .bientot{font:500 9.5px/1.4 var(--f-texte);letter-spacing:.22em;text-transform:uppercase;opacity:.55;text-align:center}
.support .fermer{position:absolute;right:10px;top:8px;background:none;border:0;color:inherit;font:300 22px/1 var(--f-texte);cursor:pointer;opacity:.6}
@media (max-aspect-ratio:1/1){.support{left:0;right:0;top:auto;bottom:0;width:auto;max-height:48%;border-radius:14px 14px 0 0}}

/* dix supports */
.s-carte-maison-close{background:#f3e9d6;border:2px solid #b08a3e;outline:1px solid #b08a3e;outline-offset:-9px;box-shadow:0 30px 60px rgba(0,0,0,.45);transform-origin:50% 0}
.s-carte-maison-close.vu{animation:deplie 1.3s var(--lent) both}
@keyframes deplie{from{transform:perspective(900px) rotateX(-88deg);opacity:0}60%{opacity:1}to{transform:perspective(900px) rotateX(0)}}
.s-dossier-enquete{background:#d8b47a;border-radius:0 6px 6px 6px;box-shadow:0 24px 50px rgba(0,0,0,.5);font-family:var(--f-machine);transform-origin:0 50%}
.s-dossier-enquete::before{content:"";position:absolute;left:0;top:-14px;width:38%;height:16px;background:#d8b47a;border-radius:6px 6px 0 0}
.s-dossier-enquete::after{content:"DOSSIER";position:absolute;right:18px;top:16px;font:12px/1 var(--f-machine);letter-spacing:.3em;color:#8b1d1d;border:2px solid #8b1d1d;padding:5px 8px;transform:rotate(8deg);opacity:.8}
.s-dossier-enquete .resume,.s-dossier-enquete h2{font-family:var(--f-machine);font-style:normal}
.s-dossier-enquete.vu{animation:ouvre 1.2s var(--lent) both}
@keyframes ouvre{from{transform:perspective(1000px) rotateY(-95deg);opacity:0}50%{opacity:1}to{transform:perspective(1000px) rotateY(0)}}
.s-boite-orange{background:#fff8ef;border-top:30px solid #F37021;box-shadow:0 26px 50px rgba(0,0,0,.45)}
.s-boite-orange::before{content:"";position:absolute;left:50%;top:-30px;width:16px;height:30px;margin-left:-8px;background:#5a3418}
.s-boite-orange.vu{animation:couvercle 1.3s var(--lent) both}
@keyframes couvercle{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.s-ardoise-bistrot{background:#1f221f;color:#f2efe6;border:12px solid #6b4a2b;box-shadow:0 24px 50px rgba(0,0,0,.55);font-family:var(--f-machine)}
.s-ardoise-bistrot .resume,.s-ardoise-bistrot h2{font-family:var(--f-machine);font-style:normal;text-shadow:0 0 1px rgba(255,255,255,.6)}
.s-ardoise-bistrot.vu{animation:descend 1.4s cubic-bezier(.3,1.35,.4,1) both}
@keyframes descend{from{transform:translateY(-120%)}to{transform:translateY(0)}}
.s-livre-enfant{background:#fffaf0;border-radius:4px 14px 14px 4px;box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.35),0 24px 50px rgba(0,0,0,.45);transform-origin:0 50%;background-image:radial-gradient(circle at 88% 10%,#F2D10F 0 5px,transparent 6px),radial-gradient(circle at 12% 92%,#F2D10F 0 4px,transparent 5px)}
.s-livre-enfant.vu{animation:page 1.4s var(--lent) both}
@keyframes page{from{transform:perspective(1100px) rotateY(100deg)}to{transform:perspective(1100px) rotateY(0)}}
.s-faire-part{background:#f7f5f0;border:7px solid #0a0a0a;outline:1px solid #0a0a0a;outline-offset:-14px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.s-faire-part.vu{animation:glisse 1.4s var(--lent) both}
@keyframes glisse{from{transform:translateY(55%);opacity:0;clip-path:inset(0 0 60% 0)}to{transform:none;opacity:1;clip-path:inset(0)}}
.s-affiche-tsigane{background:#ecd9b0;color:#3a0c0c;border:3px double #8b1a1a;box-shadow:inset 0 0 40px rgba(120,60,10,.35),0 24px 50px rgba(0,0,0,.45)}
.s-affiche-tsigane h2,.s-affiche-tsigane .resume{color:#8b1a1a}
.s-affiche-tsigane.vu{animation:deroule 1.6s var(--lent) both}
@keyframes deroule{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.s-parchemin-balkans{background:#ead8ae;color:#2a1608;box-shadow:inset 0 0 50px rgba(110,70,20,.45);border-top:14px solid transparent;border-bottom:14px solid transparent;border-image:repeating-linear-gradient(90deg,#8e1b1b 0 10px,#111 10px 14px,#8e1b1b 14px 24px,#e9d7ad 24px 28px) 14}
.s-parchemin-balkans::after{content:"";position:absolute;right:22px;bottom:22px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c23a2a,#7d1610)}
.s-parchemin-balkans.vu{animation:parchemin 1.8s var(--lent) both}
@keyframes parchemin{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0)}}
.s-etiquette-cigare{background:#f4e6c2;border:3px solid #b8892e;outline:6px solid #7a1d1d;outline-offset:-12px;box-shadow:0 24px 50px rgba(0,0,0,.45);transform-origin:50% 0}
.s-etiquette-cigare.vu{animation:deplie 1.3s var(--lent) both}
.s-etiquette-brulee{background:#e5d0a0;color:#2a1405;box-shadow:inset 0 0 22px 6px rgba(60,25,0,.75),0 24px 50px rgba(0,0,0,.5)}
.s-etiquette-brulee.vu{animation:brule 1.8s var(--lent) both}
@keyframes brule{from{clip-path:circle(0% at 50% 60%);filter:sepia(1) brightness(.4)}to{clip-path:circle(150% at 50% 60%);filter:none}}

.a-flotte{animation:flotte 4.2s ease-in-out infinite alternate}
.a-tourne{animation:tourne 22s linear infinite;transform-box:view-box}
.a-scintille{animation:scintille 3.6s linear infinite}
.a-flamme{animation:flamme 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flotte{from{transform:translate(0,-2px)}to{transform:translate(3px,3px)}}
@keyframes tourne{to{transform:rotate(360deg)}}
@keyframes scintille{0%,44%,52%,78%,100%{opacity:1}46%{opacity:.7}80%{opacity:.86}}
@keyframes flamme{to{transform:scale(.9,1.1) skewX(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>

<header class="marque" aria-label="Big Drama"><img src="logos/big-drama-clef.png" alt=""><b>Big Drama</b></header>
<button class="son" id="son" type="button" aria-pressed="true">Son</button>
<div class="seuil" id="seuil"><button type="button" id="entrer" aria-label="Entrer chez Big Drama"><img src="logos/cle.png" alt=""></button></div>
<main class="monde">
  <div class="scene" id="scene">
    <svg id="svg" viewBox="0 0 1600 900" role="img" aria-label="Une rue de Paris en 1918, chaque maison est une création de Big Drama"></svg>
    <video class="film-accueil" id="film" muted loop playsinline preload="auto" src="videos/accueil.mp4" aria-hidden="true"></video>
    <div class="vitre" id="vitre" aria-hidden="true"><video muted loop playsinline preload="none"></video></div>
    <div class="logo-survol" id="logo" aria-hidden="true"></div>
    <div class="bulle" id="bulle" aria-hidden="true"></div>
    <button class="retour" id="retour" type="button">← La rue</button>
    <aside class="support" id="support" aria-live="polite"></aside>
  </div>
</main>

<script type="module">
import { SILHOUETTES, COULEURS, COUPES, PANNEAU } from './silhouettes.js';
import { LIEUX, LOREM_LONG } from './lieux.js';

const NS = 'http://www.w3.org/2000/svg', $ = s => document.querySelector(s);
const scene = $('#scene'), svg = $('#svg'), logo = $('#logo'), bulle = $('#bulle'), support = $('#support');
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const parId = Object.fromEntries(LIEUX.map(l => [l.id, l]));
const S = SILHOUETTES.rue;
let selection = null, boites = {}, vb = [0, 0, 1600, 900], anim = null;

/* ── caméra : la vue suit le format de l'écran ── */
const aspect = () => { const r = scene.getBoundingClientRect(); return r.width / r.height; };
const largeurMax = () => Math.min(1600, 900 * aspect());
function borner([x, y, w]) {
  const a = aspect(); w = Math.min(largeurMax(), Math.max(selection ? 420 : 760, w)); const h = w / a;
  return [Math.min(1600 - w, Math.max(0, x)), Math.min(900 - h, Math.max(0, y)), w, h];
}
// parallaxe : en avançant, les calques du fond grandissent moins vite que ceux de devant
const PROFONDEUR = { 0: 0.08, 1: 0.03, 2: 0, 3: -0.03 };
const appliquer = () => {
  svg.setAttribute('viewBox', vb.map(n => n.toFixed(2)).join(' '));
  const z = largeurMax() / vb[2], cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2;
  svg.querySelectorAll(':scope > g[data-plan]').forEach(g => { const s = 1 - PROFONDEUR[g.dataset.plan] * (z - 1); g.setAttribute('transform', reduit ? '' : `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${s.toFixed(4)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`); });
  placer();
};
// un point du dessin, sur l'écran, en tenant compte de la parallaxe de son calque
function ecranDe(x, y, plan) {
  const z = largeurMax() / vb[2], cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2, s = reduit ? 1 : 1 - PROFONDEUR[plan] * (z - 1);

scene.addEventListener('click', e => { if (selection && !bouge && !e.target.closest('.piece,.fantome,.retour,.support')) fermer(); else if (!selection && !e.target.closest('.lieu')) { arme = null; survoler(null); } });

/* ── zoom molette (x2 au plus) et glisser ── */
scene.addEventListener('wheel', e => {
  if (e.target.closest('.support')) return;
  e.preventDefault(); anim = null; const [sx, sy] = versScene(e.clientX, e.clientY), k = Math.exp(e.deltaY * 0.0012), w = vb[2] * k, h = w / aspect();
  vb = borner([sx - (sx - vb[0]) * w / vb[2], sy - (sy - vb[1]) * h / vb[3], w]); appliquer(); if (!selection) survoler(null);
}, { passive: false });
let glisse = null, bouge = false;
scene.addEventListener('pointerdown', e => { if (e.target.closest('.support,.retour')) return; glisse = [e.clientX, e.clientY, vb.slice()]; bouge = false; });
addEventListener('pointermove', e => { if (!glisse) return; const dx = e.clientX - glisse[0], dy = e.clientY - glisse[1]; if (Math.hypot(dx, dy) > 6) { bouge = true; scene.classList.add('glisse'); } if (!bouge) return; anim = null; const r = scene.getBoundingClientRect(); vb = borner([glisse[2][0] - dx / r.width * vb[2], glisse[2][1] - dy / r.height * vb[3], vb[2]]); appliquer(); });
addEventListener('pointerup', () => { glisse = null; scene.classList.remove('glisse'); setTimeout(() => bouge = false, 0); });

/* ── musique : chaque création a sa musique, elle entre en 4 s et s'éteint en 4 s ──
   Les navigateurs exigent un premier geste avant tout son : c'est le clic sur la clé du seuil. */
let sonActif = true, deverrouille = false, voulu = null; const pistes = {};
const FONDU = 4000, VOLUME = 0.7, doux = k => 0.5 - Math.cos(Math.PI * k) / 2;
function piste(id) {
  const l = parId[id]; if (!l || !l.son) return null;
  if (!pistes[id]) { const a = new Audio(l.son); a.loop = true; a.volume = 0; a.preload = 'auto'; a.addEventListener('error', () => pistes[id].mort = true); pistes[id] = { a, de: 0, vers: 0, t0: 0 }; }
  return pistes[id].mort ? null : pistes[id];
}
function viser(p, cible) {
  if (!p || p.vers === cible) return;
  p.de = p.a.volume; p.vers = cible; p.t0 = performance.now();
  if (cible > 0) p.a.play().catch(() => {});
  const pas = t => { if (p.vers !== cible) return; const k = Math.min(1, (t - p.t0) / FONDU); p.a.volume = Math.max(0, Math.min(1, p.de + (cible - p.de) * doux(k))); if (k < 1) requestAnimationFrame(pas); else if (!cible) p.a.pause(); };
  requestAnimationFrame(pas);
}
function son(id) {
  voulu = id || null;
  if (!deverrouille) return;
  for (const [k, p] of Object.entries(pistes)) if (k !== voulu) viser(p, 0);
  if (voulu && sonActif) viser(piste(voulu), VOLUME);
}
$('#son').addEventListener('click', () => { sonActif = !sonActif; $('#son').setAttribute('aria-pressed', sonActif); if (!sonActif) Object.values(pistes).forEach(p => viser(p, 0)); else son(voulu || selection); });
// le seuil
function entrer() {
  deverrouille = true; $('#seuil').classList.add('ouvert');
  LIEUX.forEach(l => piste(l.id));                                        // on prépare les musiques
  const film = document.getElementById('film'); film.play().catch(() => {});
  son(voulu);
}
$('#entrer').addEventListener('click', entrer);
if (new URLSearchParams(location.search).has('direct')) { $('#seuil').classList.add('ouvert'); addEventListener('pointerdown', () => { if (!deverrouille) entrer(); }, { once: true }); }
{ const film = document.getElementById('film');
  const pret = () => { film.classList.add('pret'); film.play().catch(() => {}); };
  if (film.readyState >= 2) pret(); else film.addEventListener('loadeddata', pret, { once: true });
  film.addEventListener('error', () => film.remove(), { once: true });
  if (new URLSearchParams(location.search).has('sans-film')) film.remove(); }

/* ── démarrage et redimensionnement ── */
dessiner(); vb = borner(vueRepos()); appliquer();
let attente; addEventListener('resize', () => { clearTimeout(attente); attente = setTimeout(() => { if (selection) ouvrir(selection); else { vb = borner(vueRepos()); appliquer(); } }, 150); });
window.__bd = { ouvrir, fermer, survoler, boites, entrer };
</script>
